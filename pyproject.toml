[project]
name = "arpent"
version = "0.1.0"
description = "Verdicts on technical niches: occupied, open, or desert."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }

# Kept deliberately empty in week 1. Dependencies arrive when the code that
# needs them arrives: httpx and pydantic in week 2, anthropic in week 3,
# gradio in week 6.
dependencies = []

[project.scripts]
arpent = "arpent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arpent"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
