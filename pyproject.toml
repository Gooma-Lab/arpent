[project]
name = "arpent"
version = "0.1.0"
description = "Verdicts on technical niches: occupied, open, or desert."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }

# Dependencies arrive when the code that needs them arrives: anthropic in
# week 3, httpx with the npm connector in week 4, gradio in week 6.
dependencies = [
    "anthropic>=0.120.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[project.scripts]
arpent = "arpent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arpent"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "wip: a skeleton whose bodies are not written yet; deselected in CI",
]
