# DELIVERY.md §2 lists three gates before merge:
#   1. unit tests pass                          — active
#   2. the evaluation suite does not regress    — arrives in week 9
#   3. no plaintext key in the diff             — active
#
# Gate 2 is what separates a project that is evaluated from one that is merely
# tested. Its placeholder is below, failing loudly if it is ever forgotten.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          # No uv.lock yet — it appears the first time `uv sync` runs locally,
          # and should be committed then. Until it exists the cache keys off
          # the manifest instead.
          cache-dependency-glob: "pyproject.toml"

      - name: Install the pinned interpreter and dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Unit tests (gate 1)
        run: uv run pytest

      - name: Evaluation suite (gate 2)
        run: |
          if [ -f evals/run.py ]; then
            uv run python evals/run.py --check-regression
          else
            echo "::notice::evaluation suite not built yet — due in week 9"
          fi

  secrets:
    runs-on: ubuntu-latest
    env:
      # The official action is free for personal repositories but requires a
      # paid licence for organisation-owned ones. The binary is MIT and needs
      # neither, so we pin it and run it directly.
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version

      - name: No plaintext key in history (gate 3)
        run: ./gitleaks git . --no-banner --redact --exit-code 1
