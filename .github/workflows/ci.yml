# DELIVERY.md §2 lists three gates before merge:
#   1. unit tests pass                          — active
#   2. the evaluation suite does not regress    — arrives in week 9
#   3. no plaintext key in the diff             — active
#
# Gate 2 is what separates a project that is evaluated from one that is merely
# tested. Its placeholder is below, failing loudly if it is ever forgotten.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the pinned interpreter and dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Unit tests (gate 1)
        run: uv run pytest

      - name: Evaluation suite (gate 2)
        run: |
          if [ -f evals/run.py ]; then
            uv run python evals/run.py --check-regression
          else
            echo "::notice::evaluation suite not built yet — due in week 9"
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No plaintext key in the diff (gate 3)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
